# Met Office-documented heatwave dates for robustness check 7 (PREREGISTRATION.md, Sections 4.3 and 8).
#
# Compiled on 5 November 2026, before any outcome data were downloaded.
#
# Inclusion rule (applied to every Met Office monthly weather report and seasonal summary
# for May–September 2022–2026):
#   An event is listed only if a Met Office report (a) describes it as a heatwave, or says
#   heatwave conditions or thresholds were met, AND (b) states both its first and last day.
#   Events the Met Office describes without both dates are not listed and are not dated
#   from any other source (plan, Section 4.3). They are recorded under `not_listed` so the
#   omissions are visible.
#
# Dates are inclusive, ISO format. `quote` is the Met Office wording that gives the dates.

events:
  - id: MO2022a
    start: 2022-07-18
    end: 2022-07-19
    area: England, Wales and Scotland
    quote: "the unprecedented heatwave of the 18th/19th"
    source: mwr_2022_07

  - id: MO2023a
    start: 2023-09-04
    end: 2023-09-10
    area: UK
    quote: "From 4th to 10th, the UK experienced a significant heatwave"
    source: mwr_2023_09

  - id: MO2025a
    start: 2025-06-16
    end: 2025-06-21
    area: England and Wales
    quote: "high temperatures reached heatwave thresholds for many across England and Wales between the 16th and 21st"
    source: mwr_2025_06

  - id: MO2025b
    start: 2025-08-11
    end: 2025-08-15
    area: parts of central and eastern England
    quote: "Heatwave conditions were met in parts of central and eastern England between the 11th and 15th"
    source: mwr_2025_08

  - id: MO2026a
    start: 2026-08-10
    end: 2026-08-14
    area: southern and eastern England
    quote: "Heatwave conditions were met across southern and eastern England between the 10th and 14th"
    source: mwr_2026_08

not_listed:
  - period: August 2022
    reason: 'Described as a "hot spell"; breakdown "mid-month"; no first and last day stated.'
    source: mwr_2022_08
  - period: June 2023
    reason: '"Very warm between the 9th and the 25th", but not described as a heatwave.'
    source: mwr_2023_06
  - period: June 2024 (23rd–26th), July 2024 (final week), August 2024 (11th–12th)
    reason: 'Described as hot spells, not heatwaves.'
    source: mwr_2024_06, mwr_2024_07, mwr_2024_08
  - period: late June 2025
    reason: '"another heatwave for some parts of central and eastern England"; no dates stated.'
    source: mwr_2025_06
  - period: July 2025 (9th–14th)
    reason: 'Described as a "hot spell", not a heatwave.'
    source: mwr_2025_07
  - period: May 2026
    reason: 'Heatwave thresholds met; the hot spell "started to take hold on the 21st" but no last day of heatwave conditions is stated.'
    source: mwr_2026_05
  - period: June 2026
    reason: 'Heatwave in the second half of the month; warning dates are given but no first and last day of heatwave conditions.'
    source: mwr_2026_06, seasonal_summer_2026
  - period: July 2026
    reason: 'Heatwave conditions met over "nearly two weeks"; no first and last day stated.'
    source: mwr_2026_07, seasonal_summer_2026

